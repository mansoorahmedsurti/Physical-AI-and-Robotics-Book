<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fb;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 2rem 0;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            gap: 2rem;
            height: calc(100vh - 200px);
        }

        .sidebar {
            width: 300px;
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .chat-area {
            flex: 1;
            background: white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 0;
        }

        .bot-message {
            align-self: flex-start;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 0;
        }

        .sources {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #666;
        }

        .input-area {
            padding: 1.5rem;
            border-top: 1px solid #e9ecef;
            background: white;
        }

        .input-form {
            display: flex;
            gap: 1rem;
        }

        .message-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: #667eea;
        }

        .send-button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .new-conversation-btn {
            width: 100%;
            padding: 0.75rem;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 1rem;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        .new-conversation-btn:hover {
            background-color: #e9ecef;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 0.5rem;
            background: #f8f9fa;
            transition: background-color 0.3s;
        }

        .conversation-item:hover {
            background-color: #e9ecef;
        }

        .conversation-item.active {
            background: #667eea;
            color: white;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 10px;
            align-self: flex-start;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 0;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
                height: auto;
            }

            .sidebar {
                width: 100%;
                order: 2;
            }

            .chat-area {
                order: 1;
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>RAG Chatbot</h1>
            <p class="subtitle">Ask questions about your documents</p>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <button class="new-conversation-btn" id="newConversationBtn">
                    + New Conversation
                </button>
                <div class="conversations-list" id="conversationsList">
                    <!-- Conversations will be loaded here -->
                </div>
            </div>

            <div class="chat-area">
                <div class="messages-container" id="messagesContainer">
                    <div class="message bot-message">
                        Hello! I'm your RAG assistant. Upload some documents and ask me questions about them.
                    </div>
                </div>
                <div class="input-area">
                    <form class="input-form" id="chatForm">
                        <input
                            type="text"
                            class="message-input"
                            id="messageInput"
                            placeholder="Type your message..."
                            autocomplete="off"
                            required
                        >
                        <button type="submit" class="send-button" id="sendButton">
                            Send
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        class RAGChatbot {
            constructor() {
                this.currentConversationId = null;
                this.apiBaseUrl = '/api/v1'; // Update this to your API base URL

                this.initializeElements();
                this.bindEvents();
                this.loadConversations();
            }

            initializeElements() {
                this.messagesContainer = document.getElementById('messagesContainer');
                this.messageInput = document.getElementById('messageInput');
                this.chatForm = document.getElementById('chatForm');
                this.sendButton = document.getElementById('sendButton');
                this.newConversationBtn = document.getElementById('newConversationBtn');
                this.conversationsList = document.getElementById('conversationsList');
            }

            bindEvents() {
                this.chatForm.addEventListener('submit', (e) => this.handleSendMessage(e));
                this.newConversationBtn.addEventListener('click', () => this.startNewConversation());
            }

            async handleSendMessage(e) {
                e.preventDefault();

                const message = this.messageInput.value.trim();
                if (!message) return;

                this.sendMessage(message);
            }

            async sendMessage(message) {
                // Disable input while sending
                this.messageInput.disabled = true;
                this.sendButton.disabled = true;

                // Add user message to UI
                this.addMessageToUI(message, 'user');

                try {
                    // Clear input
                    this.messageInput.value = '';

                    // Show typing indicator
                    const typingIndicator = this.showTypingIndicator();

                    // Prepare request data
                    const requestData = {
                        message: message,
                        conversation_id: this.currentConversationId || null,
                        temperature: 0.7
                    };

                    // Send message to API
                    const response = await fetch(`${this.apiBaseUrl}/chat/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('access_token') || ''}`
                        },
                        body: JSON.stringify(requestData)
                    });

                    if (!response.ok) {
                        throw new Error(`API error: ${response.status}`);
                    }

                    const data = await response.json();

                    // Update conversation ID if this is a new conversation
                    if (!this.currentConversationId) {
                        this.currentConversationId = data.conversation_id;
                        this.addConversationToList(data.conversation_id, `Conversation ${new Date().toLocaleString()}`);
                    }

                    // Remove typing indicator
                    this.messagesContainer.removeChild(typingIndicator);

                    // Add bot response to UI
                    this.addMessageToUI(data.response, 'bot', data.sources);

                    // Update conversation in the list
                    this.updateConversationTitle(data.conversation_id, message.substring(0, 30) + '...');
                } catch (error) {
                    console.error('Error sending message:', error);

                    // Remove typing indicator
                    if (this.messagesContainer.lastChild.classList.contains('typing-indicator')) {
                        this.messagesContainer.removeChild(this.messagesContainer.lastChild);
                    }

                    // Show error message
                    this.addErrorMessage('Sorry, there was an error processing your request. Please try again.');
                } finally {
                    // Re-enable input
                    this.messageInput.disabled = false;
                    this.sendButton.disabled = false;
                    this.messageInput.focus();
                }
            }

            addMessageToUI(content, sender, sources = null) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}-message`;

                messageDiv.innerHTML = this.escapeHtml(content);

                if (sources && sources.length > 0) {
                    const sourcesDiv = document.createElement('div');
                    sourcesDiv.className = 'sources';
                    sourcesDiv.innerHTML = '<strong>Sources:</strong> ' + sources.map(source =>
                        source.content_preview ? `"${this.escapeHtml(source.content_preview)}..."` : ''
                    ).filter(Boolean).join(', ');
                    messageDiv.appendChild(sourcesDiv);
                }

                this.messagesContainer.appendChild(messageDiv);
                this.scrollToBottom();
            }

            showTypingIndicator() {
                const typingDiv = document.createElement('div');
                typingDiv.className = 'typing-indicator';
                typingDiv.innerHTML = `
                    <div class="loading"></div>
                    <span>Thinking...</span>
                `;
                this.messagesContainer.appendChild(typingDiv);
                this.scrollToBottom();
                return typingDiv;
            }

            addErrorMessage(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                this.messagesContainer.appendChild(errorDiv);
                this.scrollToBottom();
            }

            scrollToBottom() {
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            async startNewConversation() {
                this.currentConversationId = null;
                this.messagesContainer.innerHTML = '';
                this.addMessageToUI("Hello! I'm your RAG assistant. Upload some documents and ask me questions about them.", 'bot');

                // Create new conversation via API
                try {
                    const response = await fetch(`${this.apiBaseUrl}/chat/conversation/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('access_token') || ''}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.currentConversationId = data.conversation_id;
                        this.addConversationToList(data.conversation_id, `New Conversation`);
                    }
                } catch (error) {
                    console.error('Error creating new conversation:', error);
                }
            }

            async loadConversations() {
                // For now, we'll just show a message since we don't have an API endpoint to list conversations
                // In a real implementation, you would fetch conversations from /api/v1/chat/conversations/
                this.conversationsList.innerHTML = '<div class="conversation-item">No conversations yet</div>';
            }

            addConversationToList(id, title) {
                const conversationItem = document.createElement('div');
                conversationItem.className = 'conversation-item';
                conversationItem.textContent = title;
                conversationItem.onclick = () => this.selectConversation(id);

                // Add to the beginning of the list
                this.conversationsList.insertBefore(conversationItem, this.conversationsList.firstChild);
            }

            updateConversationTitle(id, title) {
                // Find and update the conversation item with the given ID
                const items = this.conversationsList.querySelectorAll('.conversation-item');
                items.forEach(item => {
                    if (item.dataset.conversationId === id) {
                        item.textContent = title;
                    }
                });
            }

            async selectConversation(id) {
                this.currentConversationId = id;

                // Clear current messages
                this.messagesContainer.innerHTML = '';

                // Load conversation history (not implemented in this example)
                // You would typically fetch from /api/v1/chat/conversation/{id}

                // For now, just add a placeholder message
                this.addMessageToUI("Conversation history loaded.", 'bot');

                // Update active state in conversation list
                document.querySelectorAll('.conversation-item').forEach(item => {
                    item.classList.remove('active');
                });

                event.target.classList.add('active');
            }
        }

        // Initialize the chatbot when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new RAGChatbot();
        });
    </script>
</body>
</html>
